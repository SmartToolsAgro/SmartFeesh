# nginx inside the "web" container. Port 8081 serves the admin app, 8082 the driver app; both send the
# API to the backend. The host's nginx sits in front (deploy/nginx-host-staging.conf).

upstream frutti_backend {
    server backend:8000;
}

# Keep the scheme set by the host's nginx (http on staging, https once a domain exists).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8081;
    root /srv/admin;
    include /etc/nginx/conf.d/frutti-app.inc;
}

server {
    listen 8082;
    root /srv/truck;
    include /etc/nginx/conf.d/frutti-app.inc;
}
