# Host nginx site for Frutti Del Mare staging, installed as /etc/nginx/sites-available/frutti-staging by
# deploy/remote-deploy.sh. It only adds ports and names and never touches the other sites on this server.
# Each app has its own name on the company domain (D-155): browsers keep cookies per host name, so the
# owner's login on the admin app and the driver's login on the driver app never replace each other (D-036).
# Phase 1 (now): the names answer on plain HTTP, and the Let's Encrypt challenge is served from a webroot.
# Phase 2 (after the certificate exists, D-155): https on 443 with the certificate files, port 80 redirects.
# The old sslip.io addresses (ports 8095 and 8096) redirect to the names.

server {
    listen 8095;
    listen [::]:8095;
    server_name _;
    return 301 http://app.fruttidelmare.com$request_uri;
}

server {
    listen 8096;
    listen [::]:8096;
    server_name _;
    return 301 http://ch.fruttidelmare.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.fruttidelmare.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frutti-acme;
    }

    location / {
        proxy_pass http://127.0.0.1:18081; # admin app
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ch.fruttidelmare.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frutti-acme;
    }

    location / {
        proxy_pass http://127.0.0.1:18082; # driver app
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}
