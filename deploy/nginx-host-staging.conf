# Host nginx site for Frutti Del Mare staging, installed as /etc/nginx/sites-available/frutti-staging by
# deploy/remote-deploy.sh. It only adds two ports and never touches the other sites on this server.
# No domain yet, so plain HTTP on the server's address (D-027). With a domain: replace both blocks with one
# server_name block on 443 and run certbot.

server {
    listen 8095;
    listen [::]:8095;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:18081; # admin app
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

server {
    listen 8096;
    listen [::]:8096;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:18082; # driver app
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}
