# Host nginx site for Frutti Del Mare staging, installed as /etc/nginx/sites-available/frutti-staging by
# deploy/remote-deploy.sh. It only adds two ports and never touches the other sites on this server.
# No domain yet, so plain HTTP (D-027). Each app has its own host name from sslip.io, a public DNS that
# answers the address written in the name: browsers keep cookies per host name, not per port, so the
# owner's login on the admin app and the driver's login on the driver app no longer replace each other
# (D-036). The bare address redirects to the name. With a domain: one server_name block per app on 443,
# then certbot.

server {
    listen 8095;
    listen [::]:8095;
    server_name _;

    if ($host != "admin.217-182-205-137.sslip.io") {
        return 301 http://admin.217-182-205-137.sslip.io:8095$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:18081; # admin app
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

server {
    listen 8096;
    listen [::]:8096;
    server_name _;

    if ($host != "chauffeur.217-182-205-137.sslip.io") {
        return 301 http://chauffeur.217-182-205-137.sslip.io:8096$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:18082; # driver app
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}
