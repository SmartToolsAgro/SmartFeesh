components:
  schemas:
    AllocationWrite:
      type: object
      properties:
        invoice:
          type: integer
          minimum: 1
        amount:
          type: string
      required:
      - amount
      - invoice
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/BatchProduct'
          readOnly: true
        supplier:
          allOf:
          - $ref: '#/components/schemas/BatchSupplier'
          readOnly: true
        receipt_reference:
          type: string
          readOnly: true
        received_on:
          type: string
          format: date
          readOnly: true
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        use_by:
          type: string
          format: date
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - number
      - product
      - receipt_reference
      - received_on
      - supplier
      - unit_cost
      - use_by
    BatchProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - reference
    BatchSupplier:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - reference
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    CategoryRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/CustomerKindEnum'
          readOnly: true
        tax_id:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        address:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        credit_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        payment_terms_days:
          type: integer
          readOnly: true
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/CustomerContact'
          readOnly: true
        is_walk_in:
          type: boolean
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - city
      - contacts
      - credit_limit
      - email
      - id
      - is_active
      - is_walk_in
      - kind
      - name
      - notes
      - payment_terms_days
      - phone
      - reference
      - tax_id
      - updated_at
    CustomerContact:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        role:
          type: string
          default: ''
          maxLength: 100
        phone:
          type: string
          default: ''
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            default: ''
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - name
    CustomerKindEnum:
      enum:
      - restaurant
      - hotel
      - fish_shop
      - supermarket
      - wholesaler
      - caterer
      - individual
      type: string
      description: |-
        * `restaurant` - Restaurant
        * `hotel` - Hôtel
        * `fish_shop` - Poissonnerie
        * `supermarket` - Supermarché
        * `wholesaler` - Grossiste
        * `caterer` - Traiteur
        * `individual` - Particulier
    CustomerWrite:
      type: object
      properties:
        reference:
          type: string
          default: ''
          maxLength: 30
        name:
          type: string
          maxLength: 150
        kind:
          allOf:
          - $ref: '#/components/schemas/CustomerKindEnum'
          default: restaurant
        tax_id:
          type: string
          default: ''
          maxLength: 20
        phone:
          type: string
          default: ''
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        address:
          type: string
          default: ''
          maxLength: 255
        city:
          type: string
          default: ''
          maxLength: 100
        notes:
          type: string
          default: ''
          maxLength: 2000
        credit_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          default: '0.000'
        payment_terms_days:
          type: integer
          maximum: 365
          minimum: 0
          default: 0
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/CustomerContact'
      required:
      - name
    DifferenceLine:
      type: object
      properties:
        receipt:
          allOf:
          - $ref: '#/components/schemas/ReceiptRef'
          readOnly: true
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Ref'
          readOnly: true
        batch:
          allOf:
          - $ref: '#/components/schemas/ReceiptBatch'
          readOnly: true
        ordered_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        invoiced_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        accepted_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        invoiced_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        accepted_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        has_difference:
          type: boolean
          readOnly: true
      required:
      - accepted_amount
      - accepted_quantity
      - batch
      - has_difference
      - id
      - invoiced_amount
      - invoiced_quantity
      - ordered_quantity
      - product
      - receipt
      - unit_cost
    DriverRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - username
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    IllustrationEnum:
      enum:
      - shrimp
      - peeled
      - fish
      - bass
      - squid
      - octopus
      - mussel
      - mix
      type: string
      description: |-
        * `shrimp` - Crevette
        * `peeled` - Crevette décortiquée
        * `fish` - Poisson
        * `bass` - Loup
        * `squid` - Calamar
        * `octopus` - Poulpe
        * `mussel` - Coquillage
        * `mix` - Mélange
    InvoicePayment:
      type: object
      description: The part of one payment that settled the invoice.
      properties:
        id:
          type: integer
          readOnly: true
        payment:
          allOf:
          - $ref: '#/components/schemas/PaymentRef'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
      required:
      - amount
      - id
      - payment
    InvoiceReceipt:
