openapi: 3.0.3
info:
  title: Frutti Del Mare ERP API
  version: 1.0.0
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfCookie
      description: Sets the CSRF cookie. The apps call it once before the first POST
        (D-008).
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          description: Wrong username or password
        '403':
          description: The account has no active role in an organization
        '429':
          description: Too many attempts
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/batches:
    get:
      operationId: listBatches
      description: |-
        Batches, newest receipt first, paginated (`limit`, `offset`). Filter by product or supplier;
        `search` matches the batch number, the supplier's receipt reference, product and supplier.
        Batches are created by goods receipts, not here.
      parameters:
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: integer
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchList'
          description: ''
  /api/v1/batches/{batch_id}:
    get:
      operationId: getBatch
      parameters:
      - in: path
        name: batch_id
        schema:
          type: integer
        required: true
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/v1/batches/{batch_id}/sales:
    get:
      operationId: getBatchSales
      description: |-
        What one lot sold over its confirmed sales: kg, revenue without VAT, cost of the goods and margin,
        then each sale line that took from it (oldest first). Office data: drivers get 403.
      parameters:
      - in: path
        name: batch_id
        schema:
          type: integer
        required: true
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSales'
          description: ''
  /api/v1/categories:
    get:
      operationId: listCategories
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: createCategory
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{category_id}:
    patch:
      operationId: renameCategory
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/counts:
    get:
      operationId: listCounts
      description: Stock counts, newest first, paginated, each with its sheet. Filter
        by status or location.
      parameters:
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: location
        schema:
          type: integer
          minimum: 1
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - counting
          - approved
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `counting` - En cours
          * `approved` - Validé
          * `cancelled` - Annulé
      tags:
      - counts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCountList'
          description: ''
    post:
      operationId: startCount
      description: |-
        Open a count sheet for a location: one line per batch it holds, with the kg the ledger expects.
        One count at a time per location.
      tags:
      - counts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CountWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CountWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/counts/{count_id}:
    get:
      operationId: getCount
      parameters:
      - in: path
        name: count_id
        schema:
          type: integer
        required: true
      tags:
      - counts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/counts/{count_id}/approve:
    post:
      operationId: approveCount
      description: Post a count correction for every difference and freeze the count.
        Every line must be counted.
      parameters:
      - in: path
        name: count_id
        schema:
          type: integer
        required: true
      tags:
      - counts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/counts/{count_id}/cancel:
    post:
      operationId: cancelCount
      description: 'Give up an open count: nothing moved.'
      parameters:
      - in: path
        name: count_id
        schema:
          type: integer
        required: true
      tags:
      - counts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/counts/{count_id}/lines:
    put:
      operationId: recordCounted
      description: |-
        Type the kg counted on lines of an open sheet (empty clears, 0 = nothing found). Errors come
        back on `lines.<index>.counted_quantity`.
      parameters:
      - in: path
        name: count_id
        schema:
          type: integer
        required: true
      tags:
      - counts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Counted'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Counted'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Counted'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/credit-notes:
    get:
      operationId: listCreditNotes
      description: |-
        Credit notes, newest first, paginated, with their invoice and lines. Filter by customer, days or
        `search` (number, invoice number, customer).
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      tags:
      - credit-notes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreditNoteList'
          description: ''
  /api/v1/credit-notes/{credit_note_id}:
    get:
      operationId: getCreditNote
      description: One credit note with its invoice and lines.
      parameters:
      - in: path
        name: credit_note_id
        schema:
          type: integer
        required: true
      tags:
      - credit-notes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
          description: ''
  /api/v1/customers:
    get:
      operationId: listCustomers
      description: |-
        Customers sorted by name, with their contacts. Archived ones only when asked (`status`); `kind`
        keeps one type. Not paginated (D-047).
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - restaurant
          - hotel
          - fish_shop
          - supermarket
          - wholesaler
          - caterer
          - individual
          type: string
          minLength: 1
        description: |-
          * `restaurant` - Restaurant
          * `hotel` - Hôtel
          * `fish_shop` - Poissonnerie
          * `supermarket` - Supermarché
          * `wholesaler` - Grossiste
          * `caterer` - Traiteur
          * `individual` - Particulier
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
          description: ''
    post:
      operationId: createCustomer
      description: A new customer. Without a reference it gets the next free `C-NNN`.
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/customers/{customer_id}:
    get:
      operationId: getCustomer
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
    patch:
      operationId: updateCustomer
      description: Change a customer. `contacts`, when sent, replaces the whole list.
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomerWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomerWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomerWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/customers/{customer_id}/archive:
    post:
      operationId: archiveCustomer
      description: Archived customers keep their history but can no longer be sold
        to. The walk-in one cannot be archived.
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/customers/{customer_id}/restore:
    post:
      operationId: restoreCustomer
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/day-labour:
    get:
      operationId: listDayLabour
      description: |-
        Days worked by day labourers, by day then name: a month for the calendar (`date_from`,
        `date_to`, inclusive), or the days of one lot or one labourer. Each day is also an expense.
      parameters:
      - in: query
        name: batch
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: labourer
        schema:
          type: integer
          minimum: 1
      tags:
      - day-labour
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayLabourEntry'
          description: ''
    post:
      operationId: createDayLabour
      description: |-
        Record a day worked, from the calendar or from a lot (the same single record, an expense of
        category day labour). Without `amount`, the labourer's usual daily pay; without `batch`, a general
        cost. A draft until approved (`approve_now` approves at once).
      tags:
      - day-labour
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayLabourWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DayLabourWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DayLabourWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayLabourEntry'
          description: ''
  /api/v1/day-labour/{entry_id}:
    put:
      operationId: updateDayLabour
      description: Correct a day not approved yet; with `approve_now`, approve it
        too.
      parameters:
      - in: path
        name: entry_id
        schema:
          type: integer
        required: true
      tags:
      - day-labour
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayLabourWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DayLabourWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DayLabourWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayLabourEntry'
          description: ''
    delete:
      operationId: deleteDayLabour
      description: Delete a day typed by mistake while it is a draft (its expense
        goes with it).
      parameters:
      - in: path
        name: entry_id
        schema:
          type: integer
        required: true
      tags:
      - day-labour
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/day-labourers:
    get:
      operationId: listDayLabourers
      description: Day labourers by name.
      parameters:
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - day-labourers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayLabourer'
          description: ''
    post:
      operationId: createDayLabourer
      description: 'Add a day labourer (not an employee: no payroll).'
      tags:
      - day-labourers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayLabourerWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DayLabourerWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DayLabourerWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayLabourer'
          description: ''
  /api/v1/day-labourers/{labourer_id}:
    put:
      operationId: updateDayLabourer
      description: 'Change a day labourer, or archive them (`is_active` false): their
        days stay.'
      parameters:
      - in: path
        name: labourer_id
        schema:
          type: integer
        required: true
      tags:
      - day-labourers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayLabourerWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DayLabourerWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DayLabourerWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayLabourer'
          description: ''
  /api/v1/employees:
    get:
      operationId: listEmployees
      description: |-
        Employees sorted by name, each with what is still unpaid. Archived ones only when asked (`status`).
        Not paginated: the company has 6 to 10 employees (Q6).
      parameters:
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - employees
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
          description: ''
    post:
      operationId: createEmployee
      description: A new employee. Without a reference it gets the next free `E-NNN`;
        the CNSS rate defaults to 17.07 %.
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/employees/{employee_id}:
    get:
      operationId: getEmployee
      parameters:
      - in: path
        name: employee_id
        schema:
          type: integer
        required: true
      tags:
      - employees
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    patch:
      operationId: updateEmployee
      description: Change an employee. A new salary applies to the months generated
        afterwards.
      parameters:
      - in: path
        name: employee_id
        schema:
          type: integer
        required: true
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/employees/{employee_id}/archive:
    post:
      operationId: archiveEmployee
      description: An archived employee keeps their history and gets no new salary
        record.
      parameters:
      - in: path
        name: employee_id
        schema:
          type: integer
        required: true
      tags:
      - employees
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/employees/{employee_id}/restore:
    post:
      operationId: restoreEmployee
      parameters:
      - in: path
        name: employee_id
        schema:
          type: integer
        required: true
      tags:
      - employees
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/expense-categories:
    get:
      operationId: listExpenseCategories
      description: 'Expense categories: the default ones first, in the brief''s order,
        then the owner''s.'
      parameters:
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - expense-categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
