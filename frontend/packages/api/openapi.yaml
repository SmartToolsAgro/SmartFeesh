  /api/v1/quotes:
    get:
      operationId: listQuotes
      description: |-
        Quotes, newest first, paginated (`limit`, `offset`). Filter by status (a sent quote past its
        validity date counts as expired), customer, days (inclusive) or `search` (number, customer).
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - sent
          - accepted
          - refused
          - expired
          type: string
          minLength: 1
        description: |-
          * `draft` - Brouillon
          * `sent` - Envoyé
          * `accepted` - Accepté
          * `refused` - Refusé
          * `expired` - Expiré
      tags:
      - quotes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteList'
          description: ''
    post:
      operationId: createQuote
      description: |-
        Prepare a quote (a draft), or with `send_now` mark it sent at once. A line without `unit_price`
        takes the sale price in force on the quote's day; without `valid_until` it is valid 3 days.
        Errors of a line come back on `lines.<index>.<field>`.
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
          description: ''
