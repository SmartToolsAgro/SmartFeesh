openapi: 3.0.3
info:
  title: Frutti Del Mare ERP API
  version: 1.0.0
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfCookie
      description: Sets the CSRF cookie. The apps call it once before the first POST
        (D-008).
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          description: Wrong username or password
        '403':
          description: The account has no active role in an organization
        '429':
          description: Too many attempts
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/categories:
    get:
      operationId: listCategories
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: createCategory
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{category_id}:
    patch:
      operationId: renameCategory
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/health:
    get:
      operationId: getHealth
      description: Liveness + database check, used by Docker, the load balancer and
        uptime monitoring.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me:
    get:
      operationId: getSession
      description: The logged-in user, their organization and their role.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    patch:
      operationId: setLanguage
      description: Change the language of the apps for the logged-in user.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLanguage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLanguage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLanguage'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/members:
    get:
      operationId: listMembers
      description: Users of the organization and their roles. Owners and managers
        only.
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/products:
    get:
      operationId: listProducts
      description: |-
        Products sorted by name. Archived ones only when asked (`status`). Not paginated: a catalogue
        holds tens of products, not thousands (D-030).
      parameters:
      - in: query
        name: category
        schema:
          type: integer
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
    post:
      operationId: createProduct
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}:
    get:
      operationId: getProduct
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: updateProduct
      description: Change the description of a product. The price changes through
        `setProductPrice`.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}/archive:
    post:
      operationId: archiveProduct
      description: Archived products keep their history but can no longer be bought
        or sold.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}/photo:
    put:
      operationId: uploadProductPhoto
      description: Replace the photo. It is turned upright, shrunk to 1200 px and
        stored as WebP without metadata.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '400':
          description: Not a readable JPEG, PNG or WebP
    delete:
      operationId: removeProductPhoto
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}/prices:
    get:
      operationId: listProductPrices
      description: Every sale price of the product, newest first, including prices
        planned for later.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductPrice'
          description: ''
    post:
      operationId: setProductPrice
      description: A new sale price from now, or from a later moment. Earlier prices
        are never changed (D-020).
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPrice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPrice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPrice'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}/restore:
    post:
      operationId: restoreProduct
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    CategoryRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    IllustrationEnum:
      enum:
      - shrimp
      - peeled
      - fish
      - bass
      - squid
      - octopus
      - mussel
      - mix
      type: string
      description: |-
        * `shrimp` - Crevette
        * `peeled` - Crevette décortiquée
        * `fish` - Poisson
        * `bass` - Loup
        * `squid` - Calamar
        * `octopus` - Poulpe
        * `mussel` - Coquillage
        * `mix` - Mélange
    LanguageEnum:
      enum:
      - fr
      - ar
      type: string
      description: |-
        * `fr` - Français
        * `ar` - العربية
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    Member:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - id
      - is_active
      - role
      - user
    Organization:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    PatchedCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
    PatchedLanguage:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/LanguageEnum'
    PatchedProductUpdate:
      type: object
      properties:
        reference:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 150
        name_ar:
          type: string
          default: ''
          maxLength: 150
        category:
          type: integer
        min_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          default: '0.000'
        storage_temp_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
        storage_temp_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
        illustration:
          allOf:
          - $ref: '#/components/schemas/IllustrationEnum'
          default: fish
    PhotoUpload:
      type: object
      properties:
        photo:
          type: string
          format: binary
      required:
      - photo
    Product:
      type: object
      description: A product as the screens show it, with the sale price in force
        now.
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        name_ar:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryRef'
          readOnly: true
        base_unit:
          type: string
          readOnly: true
        min_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        storage_temp_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          readOnly: true
          nullable: true
        storage_temp_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          readOnly: true
          nullable: true
        illustration:
          allOf:
          - $ref: '#/components/schemas/IllustrationEnum'
          readOnly: true
        photo_url:
          type: string
          nullable: true
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        current_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        current_price_from:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - base_unit
      - category
      - current_price
      - current_price_from
      - id
      - illustration
      - is_active
      - min_stock
      - name
      - name_ar
      - photo_url
      - reference
      - storage_temp_max
      - storage_temp_min
      - updated_at
    ProductCreate:
      type: object
      properties:
        reference:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 150
        name_ar:
          type: string
          default: ''
          maxLength: 150
        category:
          type: integer
        min_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          default: '0.000'
        storage_temp_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
        storage_temp_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
        illustration:
          allOf:
          - $ref: '#/components/schemas/IllustrationEnum'
          default: fish
        sale_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - category
      - name
      - reference
      - sale_price
    ProductPrice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        valid_from:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          nullable: true
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - price
      - valid_from
    RoleEnum:
      enum:
      - owner
      - manager
      - driver
      - accountant
      type: string
      description: |-
        * `owner` - Propriétaire
        * `manager` - Gestionnaire
        * `driver` - Chauffeur
        * `accountant` - Comptable
    Session:
      type: object
      description: 'Who is logged in and what they may do: the answer of `/me` and
        of a successful login.'
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        truck:
          allOf:
          - $ref: '#/components/schemas/TruckRef'
          nullable: true
          readOnly: true
      required:
      - organization
      - role
      - truck
      - user
    SetPrice:
      type: object
      properties:
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        valid_from:
          type: string
          format: date-time
          nullable: true
      required:
      - price
    TruckRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
        first_name:
          type: string
          readOnly: true
          title: Prénom
        last_name:
          type: string
          readOnly: true
          title: Nom
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
      required:
      - first_name
      - id
      - language
      - last_name
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
