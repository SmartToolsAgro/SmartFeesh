        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - suppliers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
          description: ''
    post:
      operationId: createSupplier
      description: A new supplier. Without a reference it gets the next free `F-NNN`.
      tags:
