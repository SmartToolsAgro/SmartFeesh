          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockSettingsWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockSettingsWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
