              schema:
                $ref: '#/components/schemas/StockSettings'
          description: ''
  /api/v1/stock/movements:
    get:
      operationId: listMovements
      description: |-
        The stock ledger, newest first, paginated (`limit`, `offset`). A location filter keeps the
        movements coming in or going out of it; dates are inclusive.
      parameters:
      - in: query
        name: batch
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: kind
        schema:
          enum:
          - receipt
          - transfer
          - sale
          - customer_return
          - supplier_return
          - loss
          - adjustment
          - count_correction
          type: string
          minLength: 1
        description: |-
          * `receipt` - Réception
          * `transfer` - Transfert
          * `sale` - Vente
          * `customer_return` - Retour client
          * `supplier_return` - Retour fournisseur
          * `loss` - Perte
          * `adjustment` - Ajustement
          * `count_correction` - Correction d'inventaire
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: location
        schema:
          type: integer
          minimum: 1
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: integer
          minimum: 1
      tags:
      - stock
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockMovementList'
          description: ''
  /api/v1/stock/overview:
    get:
      operationId: getStockOverview
      description: |-
