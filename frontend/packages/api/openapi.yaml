        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - issued
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `draft` - Brouillon
          * `issued` - Émise
          * `cancelled` - Annulée par avoir
