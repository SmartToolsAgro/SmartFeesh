components:
  schemas:
    AdjustmentWrite:
      type: object
      properties:
        amount:
          type: string
        reason:
          type: string
          maxLength: 200
      required:
      - amount
      - reason
    AllocationWrite:
      type: object
      properties:
        invoice:
          type: integer
          minimum: 1
        amount:
          type: string
      required:
      - amount
      - invoice
    ApprovedMonth:
      type: object
      properties:
        month:
          type: string
          format: date
          readOnly: true
        approved:
          type: integer
          readOnly: true
      required:
      - approved
      - month
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/BatchProduct'
          readOnly: true
        supplier:
          allOf:
          - $ref: '#/components/schemas/BatchSupplier'
          readOnly: true
        receipt_reference:
          type: string
          readOnly: true
        received_on:
          type: string
          format: date
          readOnly: true
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        use_by:
          type: string
          format: date
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - number
      - product
      - receipt_reference
      - received_on
      - supplier
      - unit_cost
      - use_by
    BatchHolding:
      type: object
      description: A batch of the product still on hand.
      properties:
        batch_id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        supplier_name:
          type: string
          readOnly: true
        received_on:
          type: string
          format: date
          readOnly: true
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        locations:
          type: array
          items:
            $ref: '#/components/schemas/BatchLocation'
          readOnly: true
      required:
      - batch_id
      - locations
      - number
      - quantity
      - received_on
      - supplier_name
      - unit_cost
      - value
    BatchLocation:
      type: object
      properties:
        location:
          allOf:
          - $ref: '#/components/schemas/Place'
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
      required:
      - location
      - quantity
    BatchProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - reference
    BatchRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
      required:
      - id
      - number
    BatchSaleRow:
      type: object
      description: The kilos of one lot sold by one sale line.
      properties:
        id:
          type: integer
          readOnly: true
        sale:
          allOf:
          - $ref: '#/components/schemas/SaleRef'
          readOnly: true
        sold_at:
          type: string
          format: date-time
          readOnly: true
        customer:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        discount_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        revenue_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        cost_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
      required:
      - cost_amount
      - customer
      - discount_rate
      - id
      - location
      - quantity
      - revenue_amount
      - sale
      - sold_at
      - unit_cost
      - unit_price
    BatchSales:
      type: object
      description: 'What one lot sold over its confirmed sales: the sales side of
        its result (D-040).'
      properties:
        batch_id:
          type: integer
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        margin:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BatchSaleRow'
          readOnly: true
      required:
      - batch_id
      - cost
      - margin
      - quantity
      - revenue
      - rows
    BatchSupplier:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
