        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseDetail'
          description: ''
    delete:
      operationId: deleteExpense
      description: Delete a draft typed by mistake. An expense sent for approval is
        refused instead.
