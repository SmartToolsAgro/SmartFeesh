      parameters:
      - in: path
        name: supplier_id
        schema:
          type: integer
        required: true
      tags:
      - suppliers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSupplierWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSupplierWrite'
          multipart/form-data:
