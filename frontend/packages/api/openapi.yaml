          type: boolean
          default: false
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - posted
          - partly_paid
          - paid
          - open
          type: string
          minLength: 1
        description: |-
          * `draft` - draft
          * `posted` - posted
          * `partly_paid` - partly_paid
          * `paid` - paid
          * `open` - open
