        the lots loaded that day.
      parameters:
      - in: path
        name: expense_id
        schema:
          type: integer
        required: true
      tags:
      - expenses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseDetail'
          description: ''
    put:
      operationId: updateExpense
      description: |-
        Correct a draft or an expense waiting for approval; with `approve_now`, approve it too. An approved
        or refused expense never changes: a correction is a new expense.
      parameters:
      - in: path
        name: expense_id
        schema:
          type: integer
        required: true
      tags:
      - expenses
      requestBody:
        content:
          application/json:
