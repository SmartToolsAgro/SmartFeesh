  /api/v1/transfers:
    get:
      operationId: listTransfers
      description: |-
        Transfers (truck loads, evening returns, moves between cold rooms), newest day first, paginated
        (`limit`, `offset`). Filter by kind, status, location (in or out), days (inclusive) or `search`
        (number, place names).
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: kind
        schema:
          enum:
          - load
          - return
          - internal
          type: string
          minLength: 1
        description: |-
          * `load` - Chargement
          * `return` - Retour
          * `internal` - Entre emplacements
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: location
        schema:
          type: integer
          minimum: 1
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - validated
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `draft` - Brouillon
          * `validated` - Validé
          * `cancelled` - Annulé
      tags:
      - transfers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransferList'
          description: ''
    post:
      operationId: createTransfer
      description: |-
        Prepare a transfer (a draft), or with `validate` also move the stock at once. Its kind comes
        from the places: into a truck is a load, out of one a return. A load line without `unit_price`
        takes the sale price in force. Errors of a line come back on `lines.<index>.<field>`.
      tags:
      - transfers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransferWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransferWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDetail'
          description: ''
  /api/v1/transfers/{transfer_id}:
    get:
      operationId: getTransfer
      description: One transfer; once validated, each line lists the batches its kg
        came from.
      parameters:
      - in: path
        name: transfer_id
        schema:
          type: integer
        required: true
      tags:
      - transfers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDetail'
          description: ''
    put:
      operationId: updateTransfer
      description: Change a draft (every line is replaced), and with `validate` move
        the stock too.
      parameters:
      - in: path
        name: transfer_id
        schema:
          type: integer
        required: true
      tags:
      - transfers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransferWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransferWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDetail'
          description: ''
  /api/v1/transfers/{transfer_id}/cancel:
    post:
      operationId: cancelTransfer
      description: Give up a draft. A validated transfer is corrected by a transfer
        the other way.
      parameters:
      - in: path
        name: transfer_id
        schema:
          type: integer
        required: true
      tags:
      - transfers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDetail'
          description: ''
  /api/v1/transfers/{transfer_id}/validate:
    post:
      operationId: validateTransfer
      description: |-
        Validate a draft: its kg move, oldest batch first. Refused as a whole when the source holds
        too little (on `lines.<index>.quantity`) or for a day still to come.
      parameters:
      - in: path
        name: transfer_id
        schema:
          type: integer
        required: true
      tags:
      - transfers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDetail'
          description: ''
  /api/v1/transfers/truck-day:
    get:
      operationId: getTruckDay
      description: |-
        A truck's day per product from its validated transfers: kg loaded, kg returned, and loaded −
        returned, sold or lost, with the day's price per kg and what that is worth.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: location
        schema:
          type: integer
          minimum: 1
        required: true
      tags:
      - transfers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckDay'
          description: ''
  /api/v1/truck-assignments:
    get:
      operationId: listTruckAssignments
      description: Who drives which truck on a day (today by default). A driver sees
        only their own assignment.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      tags:
      - truck-assignments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TruckAssignment'
          description: ''
    post:
      operationId: assignTruck
      description: |-
        Give a truck to a driver for a day. A driver can only take a truck for themselves; they may
        change their own mind, the office must remove the first assignment before giving another truck.
      tags:
      - truck-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TruckAssignmentWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TruckAssignmentWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TruckAssignmentWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckAssignment'
          description: ''
  /api/v1/truck-assignments/{assignment_id}:
    delete:
      operationId: unassignTruck
      description: 'Take an assignment back: the truck falls back to its usual driver
        for that day.'
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: integer
        required: true
      tags:
      - truck-assignments
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/trucks:
    get:
      operationId: listTrucks
      description: Trucks sorted by name, with their driver. A driver sees only their
        own truck.
      parameters:
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - trucks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Truck'
          description: ''
    post:
      operationId: createTruck
      description: A new truck, with the stock location that holds its goods.
      tags:
      - trucks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TruckWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TruckWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TruckWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
          description: ''
  /api/v1/trucks/{truck_id}:
    get:
      operationId: getTruck
      parameters:
      - in: path
        name: truck_id
        schema:
          type: integer
        required: true
      tags:
      - trucks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
          description: ''
    patch:
      operationId: updateTruck
      description: 'Rename a truck, change its plate or its driver (`driver: null`
        takes it back from its driver).'
      parameters:
      - in: path
        name: truck_id
        schema:
          type: integer
        required: true
      tags:
      - trucks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTruckWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTruckWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTruckWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
          description: ''
  /api/v1/trucks/{truck_id}/archive:
    post:
      operationId: archiveTruck
      description: An archived truck keeps its history, receives no more stock and
        has no driver.
      parameters:
      - in: path
        name: truck_id
        schema:
          type: integer
        required: true
      tags:
      - trucks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
          description: ''
  /api/v1/trucks/{truck_id}/restore:
    post:
      operationId: restoreTruck
      parameters:
      - in: path
        name: truck_id
        schema:
          type: integer
        required: true
      tags:
