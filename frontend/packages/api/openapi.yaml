          description: ''
    put:
      operationId: updateQuote
      description: |-
        Change a draft (every line is replaced), and with `send_now` send it too. A sent quote no longer
        changes.
      parameters:
      - in: path
        name: quote_id
        schema:
          type: integer
        required: true
      tags:
      - quotes
      requestBody:
        content:
          application/json:
