      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
          description: ''
    post:
      operationId: createSupplier
      description: A new supplier. Without a reference it gets the next free `F-NNN`.
      tags:
      - suppliers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
          description: ''
  /api/v1/suppliers/{supplier_id}:
    get:
      operationId: getSupplier
      parameters:
      - in: path
        name: supplier_id
        schema:
          type: integer
        required: true
