openapi: 3.0.3
info:
  title: Frutti Del Mare ERP API
  version: 1.0.0
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfCookie
      description: Sets the CSRF cookie. The apps call it once before the first POST
        (D-008).
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          description: Wrong username or password
        '403':
          description: The account has no active role in an organization
        '429':
          description: Too many attempts
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/batches:
    get:
      operationId: listBatches
      description: |-
        Batches, newest receipt first, paginated (`limit`, `offset`). Filter by product or supplier;
        `search` matches the batch number, the supplier's receipt reference, product and supplier.
        Batches are created by goods receipts, not here.
      parameters:
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: integer
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchList'
          description: ''
  /api/v1/batches/{batch_id}:
    get:
      operationId: getBatch
      parameters:
      - in: path
        name: batch_id
        schema:
          type: integer
        required: true
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/v1/categories:
    get:
      operationId: listCategories
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: createCategory
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{category_id}:
    patch:
      operationId: renameCategory
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/customers:
    get:
      operationId: listCustomers
      description: |-
        Customers sorted by name, with their contacts. Archived ones only when asked (`status`); `kind`
        keeps one type. Not paginated (D-047).
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - restaurant
          - hotel
          - fish_shop
          - supermarket
          - wholesaler
          - caterer
          - individual
          type: string
          minLength: 1
        description: |-
          * `restaurant` - Restaurant
          * `hotel` - Hôtel
          * `fish_shop` - Poissonnerie
          * `supermarket` - Supermarché
          * `wholesaler` - Grossiste
          * `caterer` - Traiteur
          * `individual` - Particulier
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
          description: ''
    post:
      operationId: createCustomer
      description: A new customer. Without a reference it gets the next free `C-NNN`.
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/customers/{customer_id}:
    get:
      operationId: getCustomer
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
    patch:
      operationId: updateCustomer
      description: Change a customer. `contacts`, when sent, replaces the whole list.
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomerWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomerWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomerWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/customers/{customer_id}/archive:
    post:
      operationId: archiveCustomer
      description: Archived customers keep their history but can no longer be sold
        to. The walk-in one cannot be archived.
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/customers/{customer_id}/restore:
    post:
      operationId: restoreCustomer
      parameters:
      - in: path
        name: customer_id
        schema:
          type: integer
        required: true
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/health:
    get:
      operationId: getHealth
      description: Liveness + database check, used by Docker, the load balancer and
        uptime monitoring.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/locations:
    get:
      operationId: listLocations
      description: Cold rooms, trucks and other locations, sorted by kind then name.
        Archived ones only when asked.
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - cold_room
          - truck
          - other
          type: string
          minLength: 1
        description: |-
          * `cold_room` - Chambre froide
          * `truck` - Camion
          * `other` - Autre
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockLocation'
          description: ''
    post:
      operationId: createLocation
      description: A new cold room or other location. A truck is created with `createTruck`.
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockLocationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockLocationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockLocationCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocation'
          description: ''
  /api/v1/locations/{location_id}:
    get:
      operationId: getLocation
      parameters:
      - in: path
        name: location_id
        schema:
          type: integer
        required: true
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocation'
          description: ''
    patch:
      operationId: updateLocation
      description: Rename a cold room or other location, or change whether it sells
        at the counter.
      parameters:
      - in: path
        name: location_id
        schema:
          type: integer
        required: true
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStockLocationUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStockLocationUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStockLocationUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocation'
          description: ''
  /api/v1/locations/{location_id}/archive:
    post:
      operationId: archiveLocation
      description: An archived location keeps its history but receives no more stock.
      parameters:
      - in: path
        name: location_id
        schema:
          type: integer
        required: true
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocation'
          description: ''
  /api/v1/locations/{location_id}/restore:
    post:
      operationId: restoreLocation
      parameters:
      - in: path
        name: location_id
        schema:
          type: integer
        required: true
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocation'
          description: ''
  /api/v1/me:
    get:
      operationId: getSession
      description: The logged-in user, their organization and their role.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    patch:
      operationId: setLanguage
      description: Change the language of the apps for the logged-in user.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLanguage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLanguage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLanguage'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/members:
    get:
      operationId: listMembers
      description: Users of the organization and their roles. Owners and managers
        only.
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/products:
    get:
      operationId: listProducts
      description: |-
        Products sorted by name. Archived ones only when asked (`status`). Not paginated: a catalogue
        holds tens of products, not thousands (D-030).
      parameters:
      - in: query
        name: category
        schema:
          type: integer
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
    post:
      operationId: createProduct
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}:
    get:
      operationId: getProduct
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: updateProduct
      description: Change the description of a product. The price changes through
        `setProductPrice`.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}/archive:
    post:
      operationId: archiveProduct
      description: Archived products keep their history but can no longer be bought
        or sold.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}/photo:
    put:
      operationId: uploadProductPhoto
      description: Replace the photo. It is turned upright, shrunk to 1200 px and
        stored as WebP without metadata.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '400':
          description: Not a readable JPEG, PNG or WebP
    delete:
      operationId: removeProductPhoto
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}/prices:
    get:
      operationId: listProductPrices
      description: Every sale price of the product, newest first, including prices
        planned for later.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductPrice'
          description: ''
    post:
      operationId: setProductPrice
      description: A new sale price from now, or from a later moment. Earlier prices
        are never changed (D-020).
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPrice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPrice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPrice'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{product_id}/restore:
    post:
      operationId: restoreProduct
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/receipts:
    get:
      operationId: listReceipts
      description: |-
        Goods receipts, newest first, paginated (`limit`, `offset`), each with its lines and totals.
        Filter by supplier, by `search` (number, supplier's reference, supplier name) or to receipts with
        a weight difference.
      parameters:
      - in: query
        name: differences
        schema:
          type: boolean
          default: false
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      - in: query
        name: uninvoiced
        schema:
          type: boolean
          default: false
      tags:
      - receipts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReceiptList'
          description: ''
    post:
      operationId: createReceipt
      description: |-
        Record goods received from a supplier: one batch per line, its accepted net weight into stock.
        Errors of a line come back on `lines.<index>.<field>`.
      tags:
      - receipts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReceiptWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiptWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
  /api/v1/receipts/{receipt_id}:
    get:
      operationId: getReceipt
      parameters:
      - in: path
        name: receipt_id
        schema:
          type: integer
        required: true
      tags:
      - receipts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
  /api/v1/receipts/differences:
    get:
      operationId: listReceiptDifferences
      description: |-
        Weight differences report: receipt lines whose accepted weight is not the invoiced or ordered
        weight, newest first, paginated. Filter by supplier and by receipt dates (inclusive).
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      tags:
      - receipts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDifferenceLineList'
          description: ''
  /api/v1/receipts/last-costs:
    get:
      operationId: listLastPurchaseCosts
      description: |-
        What was last paid one supplier for each product (its latest batch). The receipt form suggests
        it and shows the change. The full history per product and supplier is `listBatches`.
      parameters:
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
        required: true
      tags:
      - receipts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LastCost'
          description: ''
  /api/v1/supplier-balances/{supplier_id}:
    get:
      operationId: getSupplierBalance
      description: |-
        The trade balance with one supplier: posted invoices − payments, with what is overdue, advances not
        allocated, drafts and receipts not invoiced yet. A partner's capital and profit share are not in it.
      parameters:
      - in: path
        name: supplier_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-balances
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierBalance'
          description: ''
  /api/v1/supplier-invoices:
    get:
      operationId: listSupplierInvoices
      description: |-
        Supplier invoices, newest first, paginated, each with its receipts, payments, paid amount and what
        is still owed. Filter by supplier, status (`open` = posted and not fully paid), overdue, or `search`
        (our number, the supplier's invoice number, the supplier's name).
      parameters:
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: overdue
        schema:
          type: boolean
          default: false
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - posted
          - partly_paid
          - paid
          - open
          type: string
          minLength: 1
        description: |-
          * `draft` - draft
          * `posted` - posted
          * `partly_paid` - partly_paid
          * `paid` - paid
          * `open` - open
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      tags:
      - supplier-invoices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupplierInvoiceList'
          description: ''
    post:
      operationId: createSupplierInvoice
      description: |-
        Record a supplier invoice for some of their receipts, as a draft, or posted at once with `post`.
        Its amount is the receipts' invoiced amount (invoiced kg × cost); a receipt goes on one invoice only.
      tags:
      - supplier-invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
          description: ''
  /api/v1/supplier-invoices/{invoice_id}:
    get:
      operationId: getSupplierInvoice
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
          description: ''
    put:
      operationId: updateSupplierInvoice
      description: |-
        Change a draft invoice: receipts, dates, reference, notes; `post` posts it afterwards. A posted
        invoice no longer changes (400). The supplier does not change.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUpdate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
          description: ''
    delete:
      operationId: deleteSupplierInvoice
      description: Delete a draft invoice; its receipts can go on another one. A posted
        invoice is never deleted (400).
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/supplier-invoices/{invoice_id}/post:
    post:
      operationId: postSupplierInvoice
      description: 'Post a draft invoice: it is owed to the supplier, counts in their
        balance and can be paid. Final.'
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoice'
          description: ''
  /api/v1/supplier-payments:
    get:
      operationId: listSupplierPayments
      description: |-
        Payments to suppliers, newest first, paginated, with the invoices each one settled and the part
        not allocated yet. Filter by supplier, to payments with an unallocated part, or `search` (number,
        cheque or transfer reference, supplier's name).
      parameters:
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: supplier
        schema:
          type: integer
          minimum: 1
      - in: query
        name: unallocated
        schema:
          type: boolean
          default: false
      tags:
      - supplier-payments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupplierPaymentList'
          description: ''
    post:
      operationId: recordSupplierPayment
      description: |-
        Record money paid to a supplier and the posted invoices it settles. What is not allocated is an
        advance, to allocate later. Errors of an allocation come back on `allocations.<index>.<field>`.
      tags:
      - supplier-payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierPaymentWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierPaymentWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierPaymentWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPayment'
          description: ''
  /api/v1/supplier-payments/{payment_id}:
    get:
      operationId: getSupplierPayment
      parameters:
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-payments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPayment'
          description: ''
  /api/v1/supplier-payments/{payment_id}/allocations:
    post:
      operationId: allocateSupplierPayment
      description: Allocate the part of a payment not allocated yet (an advance) to
        posted invoices of its supplier.
      parameters:
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAllocate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentAllocate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentAllocate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPayment'
          description: ''
  /api/v1/suppliers:
    get:
      operationId: listSuppliers
      description: |-
        Suppliers sorted by name, with their contacts. Archived ones only when asked (`status`). Not
        paginated: the company works with a handful of suppliers (D-032).
      parameters:
      - in: query
