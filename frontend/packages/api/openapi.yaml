          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - pending
          - approved
          - rejected
          type: string
          minLength: 1
        description: |-
          * `draft` - Brouillon
          * `pending` - À approuver
          * `approved` - Approuvée
          * `rejected` - Refusée
