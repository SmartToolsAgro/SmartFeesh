      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
          description: ''
  /api/v1/suppliers/{supplier_id}:
