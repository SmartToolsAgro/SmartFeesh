      operationId: updateSupplierInvoice
      description: |-
        Change a draft invoice: receipts, dates, reference, notes; `post` posts it afterwards. A posted
        invoice no longer changes (400). The supplier does not change.
      parameters:
      - in: path
        name: invoice_id
        schema:
          type: integer
        required: true
      tags:
      - supplier-invoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUpdate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
