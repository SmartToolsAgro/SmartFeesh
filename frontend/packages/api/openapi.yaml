  /api/v1/invoices:
    get:
      operationId: listInvoices
      description: |-
        Invoices, drafts first then the newest issued, paginated (`limit`, `offset`). Filter by status,
        customer, sale, issue days (inclusive) or `search` (number, sale number, customer). Office roles read.
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
          minimum: 1
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: L'index initial depuis lequel retourner les résultats.
        schema:
          type: integer
      - in: query
        name: sale
        schema:
          type: integer
          minimum: 1
