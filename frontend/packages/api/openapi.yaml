    post:
      operationId: createExpense
      description: |-
        Record an expense as a draft, or with `approve_now` approved at once. `batch` charges it to a
        lot; `truck` makes it a truck cost of that day, split over the lots loaded that day by kg. A day
        labourer's day is recorded in the day-labour calendar instead.
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpenseWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseDetail'
          description: ''
  /api/v1/expenses/{expense_id}:
    get:
      operationId: getExpense
